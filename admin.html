<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsat Admin - පාලන පුවරුව</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --sidebar-bg: #0f172a; --sidebar-hover: #1e293b; --bg: #f1f5f9;
    --primary: #6366f1; --danger: #ef4444; --text-dark: #1e293b; --text-light: #64748b;
    --radius: 16px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans Sinhala', sans-serif; background: var(--bg); color: var(--text-dark); display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 260px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; transition: 0.3s; position: fixed; height: 100vh; z-index: 100; }
  .sidebar-logo { padding: 25px 20px; font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .sidebar-logo i { color: var(--primary); }
  .menu { padding: 20px 10px; flex: 1; }
  .menu-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-radius: 10px; color: #cbd5e1; text-decoration: none; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 5px; }
  .menu-item:hover, .menu-item.active { background: var(--sidebar-hover); color: white; }
  .menu-item i { width: 20px; text-align: center; }
  .logout-btn { margin: 20px; padding: 15px; background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; transition: 0.2s; }
  .logout-btn:hover { background: var(--danger); color: white; }

  /* Main Content */
  .main-content { flex: 1; margin-left: 260px; padding: 30px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .header h1 { font-size: 28px; font-weight: 900; }
  .user-info { display: flex; align-items: center; gap: 10px; background: white; padding: 8px 15px; border-radius: 30px; box-shadow: var(--shadow); font-weight: 700; font-size: 14px; }

  /* Stats Grid */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); display: flex; align-items: center; gap: 15px; }
  .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
  .stat-icon.news { background: linear-gradient(135deg, var(--primary), #8b5cf6); }
  .stat-icon.songs { background: linear-gradient(135deg, #f59e0b, #ef4444); }
  .stat-details h3 { font-size: 24px; font-weight: 900; margin-bottom: 2px; }
  .stat-details p { font-size: 13px; color: var(--text-light); font-weight: 600; }

  /* Content Tables/Cards */
  .data-section { background: white; border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: none; }
  .data-section.active { display: block; }
  .data-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .data-header h2 { font-size: 20px; font-weight: 800; }
  
  .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
  .data-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; position: relative; transition: 0.2s; }
  .data-card:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(99,102,241,0.1); }
  .data-card h4 { font-size: 16px; margin-bottom: 5px; padding-right: 30px; }
  .data-card p { font-size: 13px; color: var(--text-light); margin-bottom: 10px; }
  .data-card .badge { font-size: 11px; background: #e0e7ff; color: var(--primary); padding: 3px 8px; border-radius: 10px; font-weight: 700; }
  .delete-btn { position: absolute; top: 15px; right: 15px; background: #fee2e2; color: var(--danger); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
  .delete-btn:hover { background: var(--danger); color: white; }

  /* Login Overlay */
  .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
  .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
  .login-box h2 { margin-bottom: 20px; color: var(--text-dark); }
  .login-box input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 14px; }
  .login-box button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main-content { margin-left: 0; }
    .sidebar.active { transform: translateX(0); }
  }
</style>
</head>
<body>

<!-- Admin Login (පිවිසුම් තිරය) -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2><i class="fa-solid fa-lock" style="color: var(--primary);"></i> Admin Login</h2>
    <form id="adminLoginForm">
      <input type="email" id="adminEmail" placeholder="ඊමේල් ලිපිනය" required>
      <input type="password" id="adminPass" placeholder="මුරපදය" required>
      <button type="submit">පිවිසෙන්න</button>
    </form>
    <p id="loginError" style="color: var(--danger); margin-top: 15px; font-size: 13px; display: none;">දෝෂයකි. නැවත උත්සාහ කරන්න.</p>
  </div>
</div>

<!-- Dashboard Layout -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo"><i class="fa-solid fa-bolt"></i> Newsat</div>
  <div class="menu">
    <a class="menu-item active" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a class="menu-item" onclick="switchTab('news', this)"><i class="fa-regular fa-newspaper"></i> පුවත් (News)</a>
    <a class="menu-item" onclick="switchTab('songs', this)"><i class="fa-solid fa-music"></i> ගීත (Songs)</a>
    <a class="menu-item" href="index.html"><i class="fa-solid fa-house"></i> වෙබ් අඩවියට</a>
  </div>
  <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> පිටවන්න</button>
</div>

<div class="main-content">
  <div class="header">
    <h1>පාලන පුවරුව (Dashboard)</h1>
    <div class="user-info">
      <i class="fa-solid fa-user-shield" style="color: var(--primary);"></i>
      <span id="userEmailDisplay">Admin</span>
    </div>
  </div>

  <!-- Dashboard Stats -->
  <div class="stats-grid" id="dashboardSection">
    <div class="stat-card">
      <div class="stat-icon news"><i class="fa-regular fa-newspaper"></i></div>
      <div class="stat-details">
        <h3 id="totalNewsCount">0</h3>
        <p>මුළු පුවත් ගණන</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon songs"><i class="fa-solid fa-music"></i></div>
      <div class="stat-details">
        <h3 id="totalSongsCount">0</h3>
        <p>මුළු ගීත ගණන</p>
      </div>
    </div>
  </div>

  <!-- News Management -->
  <div class="data-section" id="newsSection">
    <div class="data-header">
      <h2>පුවත් කළමනාකරණය</h2>
    </div>
    <div class="data-grid" id="adminNewsGrid">
      <!-- පුවත් මෙතැනට පූරණය වේ -->
    </div>
  </div>

  <!-- Songs Management -->
  <div class="data-section" id="songsSection">
    <div class="data-header">
      <h2>ගීත කළමනාකරණය</h2>
    </div>
    <div class="data-grid" id="adminSongsGrid">
      <!-- ගීත මෙතැනට පූරණය වේ -->
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // ඔබගේ අලුත් Firebase Config එක
  const firebaseConfig = {
    apiKey: "AIzaSyBMmZuPV3XKlYkGqjQYd7aJpFb8MZc-P9k",
    authDomain: "newsat-209f8.firebaseapp.com",
    projectId: "newsat-209f8",
    storageBucket: "newsat-209f8.firebasestorage.app",
    messagingSenderId: "529324718671",
    appId: "1:529324718671:web:0f45e89bf317cbb0c9083a",
    measurementId: "G-VQ1FYLV51P"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginOverlay = document.getElementById('loginOverlay');
  const userEmailDisplay = document.getElementById('userEmailDisplay');
  let allNewsData = [];
  let allSongsData = [];

  // Tab Switching
  window.switchTab = (tabId, element) => {
    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
    if(element) element.classList.add('active');
    
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('newsSection').classList.remove('active');
    document.getElementById('songsSection').classList.remove('active');

    if (tabId === 'dashboard') {
      document.getElementById('dashboardSection').style.display = 'grid';
    } else if (tabId === 'news') {
      document.getElementById('newsSection').classList.add('active');
    } else if (tabId === 'songs') {
      document.getElementById('songsSection').classList.add('active');
    }
  };

  // Authentication
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginOverlay.style.display = 'none';
      userEmailDisplay.textContent = user.email;
      loadData(); // දත්ත පූරණය කරන්න
    } else {
      loginOverlay.style.display = 'flex';
    }
  });

  document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value;
    const pass = document.getElementById('adminPass').value;
    signInWithEmailAndPassword(auth, email, pass)
      .catch(err => {
        document.getElementById('loginError').style.display = 'block';
      });
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth);
  });

  // Load Data from Firestore
  function loadData() {
    // Load News
    const qNews = query(collection(db, "news"), orderBy("time", "desc"));
    onSnapshot(qNews, (snapshot) => {
      allNewsData = [];
      snapshot.forEach(doc => allNewsData.push({ id: doc.id, ...doc.data() }));
      document.getElementById('totalNewsCount').textContent = allNewsData.length;
      renderAdminNews();
    });

    // Load Songs
    const qSongs = query(collection(db, "songs"), orderBy("time", "desc"));
    onSnapshot(qSongs, (snapshot) => {
      allSongsData = [];
      snapshot.forEach(doc => allSongsData.push({ id: doc.id, ...doc.data() }));
      document.getElementById('totalSongsCount').textContent = allSongsData.length;
      renderAdminSongs();
    });
  }

  // Render News in Admin Panel
  function renderAdminNews() {
    const grid = document.getElementById('adminNewsGrid');
    if (allNewsData.length === 0) { grid.innerHTML = '<p>පුවත් නොමැත.</p>'; return; }
    
    grid.innerHTML = allNewsData.map(n => `
      <div class="data-card">
        <button class="delete-btn" onclick="deleteItem('news', '${n.id}')"><i class="fa-solid fa-trash"></i></button>
        <span class="badge">${n.category}</span>
        <h4 style="margin-top: 10px;">${n.title}</h4>
        <p>${n.author}</p>
      </div>
    `).join('');
  }

  // Render Songs in Admin Panel
  function renderAdminSongs() {
    const grid = document.getElementById('adminSongsGrid');
    if (allSongsData.length === 0) { grid.innerHTML = '<p>ගීත නොමැත.</p>'; return; }
    
    grid.innerHTML = allSongsData.map(s => `
      <div class="data-card">
        <button class="delete-btn" onclick="deleteItem('songs', '${s.id}')"><i class="fa-solid fa-trash"></i></button>
        <span class="badge" style="background:#fef3c7; color:#d97706;">${s.category}</span>
        <h4 style="margin-top: 10px;">${s.title}</h4>
        <p>${s.artist}</p>
      </div>
    `).join('');
  }

  // Delete Function
  window.deleteItem = async (collectionName, id) => {
    if (confirm('ඔබට මෙය මකා දැමීමට අවශ්‍ය බව ස්ථිරද?')) {
      try {
        await deleteDoc(doc(db, collectionName, id));
        alert('සාර්ථකව මකා දමන ලදී.');
      } catch (error) {
        alert('මකා දැමීමේ දෝෂයකි: ' + error.message);
      }
    }
  };
</script>
</body>
</html>
