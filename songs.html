<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsat Music - ඔබේ ගීත එකතුව</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* ===== මූලික සැකසුම් ===== */
  :root {
    --primary: #8b5cf6; /* Purple */
    --secondary: #ec4899; /* Pink */
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-dark: #1e293b;
    --text-light: #64748b;
    --radius: 20px;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans Sinhala', sans-serif;
    background: linear-gradient(135deg, #f3e8ff 0%, #fce7f3 100%);
    background-attachment: fixed;
    color: var(--text-dark);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ===== Header ===== */
  header {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 15px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.5);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .logo i { -webkit-text-fill-color: var(--primary); }

  /* Buttons */
  .btn {
    padding: 10px 24px;
    border-radius: 30px;
    border: none;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    text-decoration: none;
  }
  .btn-primary {
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    color: white;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6); }
  .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
  .btn-outline:hover { background: var(--primary); color: white; }
  .btn-download { background: var(--text-dark); color: white; width: 100%; justify-content: center; margin-top: 10px; }
  .btn-download:hover { background: #0f172a; }

  /* ===== Tabs (Categories) ===== */
  .tabs-container {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
    position: sticky;
    top: 75px;
    z-index: 90;
    overflow-x: auto;
    white-space: nowrap;
    padding: 0 20px;
  }
  .tabs {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    padding: 10px 0;
  }
  .tab {
    padding: 8px 20px;
    border-radius: 20px;
    border: none;
    background: transparent;
    font-weight: 600;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
  }
  .tab:hover { background: rgba(139, 92, 246, 0.1); color: var(--primary); }
  .tab.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); }

  /* ===== Main Layout ===== */
  .container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
  }

  .section-title {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title i { color: var(--secondary); font-size: 20px; }

  /* ===== Song Grid ===== */
  .song-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
  }
  .song-card {
    background: white;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: all 0.4s ease;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .song-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15); }
  
  .song-image {
    height: 200px;
    background: linear-gradient(135deg, #c4b5fd, #f9a8d4);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .song-image img { width: 100%; height: 100%; object-fit: cover; }
  .song-image .fallback-icon { font-size: 60px; color: white; opacity: 0.8; }
  .song-category {
    position: absolute;
    top: 15px; left: 15px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(5px);
    color: var(--primary);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .play-icon-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    width: 60px; height: 60px;
    background: rgba(139, 92, 246, 0.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 24px;
    opacity: 0; transition: all 0.3s ease;
    pointer-events: none;
  }
  .song-card:hover .play-icon-overlay { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .song-content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
  .song-content h3 { font-size: 18px; margin-bottom: 5px; color: var(--text-dark); }
  .song-artist { color: var(--text-light); font-size: 14px; margin-bottom: 15px; display: flex; align-items: center; gap: 6px; }
  .song-desc { font-size: 13px; color: #475569; margin-bottom: 15px; flex: 1; }

  /* ===== Modals ===== */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(5px);
    display: none; justify-content: center; align-items: center;
    z-index: 1000; padding: 20px;
  }
  .modal-box {
    background: white; padding: 30px; border-radius: 24px;
    width: 100%; max-width: 500px; position: relative;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    animation: modalSlideUp 0.3s ease;
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes modalSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .close-btn {
    position: absolute; top: 20px; right: 20px;
    background: #f1f5f9; border: none; width: 32px; height: 32px;
    border-radius: 50%; font-size: 16px; cursor: pointer;
    color: var(--text-light); transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: #e2e8f0; color: var(--text-dark); }
  .modal-box h3 { font-size: 22px; margin-bottom: 20px; color: var(--text-dark); }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: var(--text-light); }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0;
    border-radius: 12px; font-family: inherit; font-size: 14px;
    outline: none; transition: border 0.3s; background: #f8fafc;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: var(--primary); background: white;
  }
  .form-group textarea { resize: vertical; height: 80px; }
  .modal-btn { width: 100%; justify-content: center; padding: 14px; font-size: 16px; margin-top: 10px; }

  /* ===== Responsive ===== */
  @media (max-width: 600px) {
    .header-inner { flex-direction: column; align-items: stretch; }
    .tabs-container { top: 120px; }
    .song-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-inner">
    <a href="#" class="logo"><i class="fa-solid fa-music"></i> Newsat Music</a>
    
    <div class="header-actions">
      <button class="btn btn-outline" id="postSongBtn">
        <i class="fa-solid fa-plus"></i> ගීතයක් එකතු කරන්න
      </button>
    </div>
  </div>
</header>

<!-- Tabs -->
<div class="tabs-container">
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">සියල්ල</button>
    <button class="tab" data-cat="සිංහල">සිංහල</button>
    <button class="tab" data-cat="දෙමළ">දෙමළ</button>
    <button class="tab" data-cat="ඉංග්‍රීසි">ඉංග්‍රීසි</button>
    <button class="tab" data-cat="බටහිර">බටහිර</button>
  </div>
</div>

<!-- Main Content -->
<div class="container">
  <h2 class="section-title"><i class="fa-solid fa-compact-disc"></i> නවතම ගීත</h2>
  
  <div class="song-grid" id="songGrid">
    <!-- ගීත මෙතැනට පූරණය වේ -->
    <p style="grid-column: 1/-1; text-align: center; padding: 30px; color: var(--text-light);">
      <i class="fa-solid fa-spinner fa-spin"></i> ගීත පූරණය වෙමින් පවතී...
    </p>
  </div>
</div>

<!-- Post Song Modal -->
<div class="modal-overlay" id="postSongModal">
  <div class="modal-box">
    <button class="close-btn" onclick="toggleModal('postSongModal', false)"><i class="fa-solid fa-xmark"></i></button>
    <h3><i class="fa-solid fa-music" style="color: var(--primary);"></i> නව ගීතයක් එකතු කරන්න</h3>
    
    <form id="postSongForm">
      <div class="form-group">
        <label>ගීතයේ නම (Song Title)</label>
        <input type="text" id="songTitle" placeholder="උදා: රන් සමනල්ලු" required>
      </div>

      <div class="form-group">
        <label>ගායකයා (Artist)</label>
        <input type="text" id="songArtist" placeholder="උදා: පණ්ඩිත් අමරදේව" required>
      </div>

      <div class="form-group">
        <label>කාණ්ඩය (Category)</label>
        <select id="songCat">
          <option value="සිංහල">සිංහල</option>
          <option value="දෙමළ">දෙමළ</option>
          <option value="ඉංග්‍රීසි">ඉංග්‍රීසි</option>
          <option value="බටහිර">බටහිර</option>
        </select>
      </div>

      <div class="form-group">
        <label>පින්තූරයේ ලින්ක් එක (Image URL)</label>
        <input type="url" id="songImg" placeholder="https://example.com/image.jpg" required>
      </div>

      <div class="form-group">
        <label>Google Drive ලින්ක් එක (Download Link)</label>
        <input type="url" id="songLink" placeholder="https://drive.google.com/file/d/xxxx/view" required>
      </div>

      <div class="form-group">
        <label>කෙටි විස්තරයක් (Description)</label>
        <textarea id="songDesc" placeholder="ගීතය ගැන කෙටි විස්තරයක්..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary modal-btn">ගීතය පළ කරන්න</button>
    </form>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // ඔබගේ Firebase Config එක
  const firebaseConfig = {
    apiKey: "AIzaSyBMmZuPV3XKlYKGgjjYd7aJpFb8MZc-P9k",
    authDomain: "newsat-209f8.firebaseapp.com",
    projectId: "newsat-209f8",
    storageBucket: "newsat-209f8.firebasestorage.app",
    messagingSenderId: "529324718671",
    appId: "1:529324718671:web:0f45e89bf317cbb0c9083a",
    measurementId: "G-VQ1FYLV51P"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const songGrid = document.getElementById('songGrid');
  let currentCategory = 'all';
  let allSongs = [];

  window.toggleModal = (id, show) => {
    document.getElementById(id).style.display = show ? 'flex' : 'none';
  };

  // ගීත පළ කිරීමේ පෝරමය
  document.getElementById('postSongBtn').addEventListener('click', () => {
    // මෙතැනට ලොග් වීමේ පද්ධතියක් එකතු කළ හැක. දැනට සියල්ලන්ට පළ කළ හැක.
    toggleModal('postSongModal', true);
  });

  document.getElementById('postSongForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const title = document.getElementById('songTitle').value;
    const artist = document.getElementById('songArtist').value;
    const cat = document.getElementById('songCat').value;
    const img = document.getElementById('songImg').value;
    const link = document.getElementById('songLink').value;
    const desc = document.getElementById('songDesc').value;
    
    try {
      await addDoc(collection(db, "songs"), {
        title: title,
        artist: artist,
        category: cat,
        image: img,
        link: link,
        desc: desc,
        time: serverTimestamp()
      });
      toggleModal('postSongModal', false);
      document.getElementById('postSongForm').reset();
      alert('ගීතය සාර්ථකව එකතු කරන ලදී!');
    } catch (err) {
      alert('දෝෂයකි: ' + err.message);
    }
  });

  // Firestore වලින් ගීත ලබා ගැනීම
  const q = query(collection(db, "songs"), orderBy("time", "desc"));
  onSnapshot(q, (snapshot) => {
    allSongs = [];
    snapshot.forEach((doc) => {
      allSongs.push({ id: doc.id, ...doc.data() });
    });
    renderSongs();
  });

  // ගීත පෙන්වීමේ ශ්‍රිතය
  function renderSongs() {
    let filtered = allSongs;
    if (currentCategory !== 'all') filtered = filtered.filter(s => s.category === currentCategory);

    if (filtered.length === 0) {
      songGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 30px; color: var(--text-light);">ගීත හමු නොවීය.</p>`;
      return;
    }

    songGrid.innerHTML = filtered.map(s => `
      <article class="song-card">
        <div class="song-image">
          <span class="song-category">${s.category}</span>
          ${s.image ? `<img src="${s.image}" alt="${s.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : ''}
          <i class="fa-solid fa-music fallback-icon" style="display: ${s.image ? 'none' : 'block'}"></i>
          <div class="play-icon-overlay"><i class="fa-solid fa-download"></i></div>
        </div>
        <div class="song-content">
          <h3>${s.title}</h3>
          <p class="song-artist"><i class="fa-solid fa-microphone"></i> ${s.artist}</p>
          <p class="song-desc">${s.desc || 'විස්තරයක් නොමැත.'}</p>
          
          <!-- Download බොත්තම - Google Drive ලින්ක් එකට යොමු වේ -->
          <a href="${s.link}" target="_blank" class="btn btn-download">
            <i class="fa-solid fa-cloud-arrow-down"></i> බාගත කරන්න (Download)
          </a>
        </div>
      </article>
    `).join('');
  }

  // ටැබ් මාරු කිරීම
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.cat;
      renderSongs();
    });
  });
</script>
</body>
</html>
