<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsat.space - Tech & News Hub</title>
    
    <!-- Firebase App (Modular CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --border: #1f293d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --success: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg-card); position: sticky; top: 0; z-index: 100; }
        @media(min-width: 768px) { header { flex-direction: row; justify-content: space-between; padding: 15px 30px; } }
        .logo { font-size: 22px; font-weight: bold; color: var(--primary); cursor: pointer; }
        .logo span { color: var(--accent); }
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        nav button { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        nav button:hover, nav button.active { background: var(--primary); color: var(--bg-main); border-color: var(--primary); font-weight: bold; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 10px; margin-bottom: 20px; }
        h3 { margin-bottom: 15px; color: var(--primary); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0 20px 0; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; font-size: 14px; }
        button.btn { background: linear-gradient(135deg, var(--primary), #2563eb); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        button.btn:hover { opacity: 0.9; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .news-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .news-card img { width: 100%; height: 160px; object-fit: cover; }
        .news-content { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .news-title { font-size: 18px; margin-bottom: 8px; color: var(--primary); }
        .news-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
        .news-meta { font-size: 12px; color: var(--accent); display: flex; justify-content: space-between; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--primary); }
        .action-btn { padding: 6px 10px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; margin-right: 5px; }
        .btn-approve { background: var(--success); color: white; }
        .btn-delete { background: var(--accent); color: white; }
        .user-info { display: flex; justify-content: space-between; align-items: center; background: rgba(56, 189, 248, 0.1); padding: 12px 18px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.2); margin-bottom: 20px; }
        footer { text-align: center; padding: 20px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 14px; background: var(--bg-card); }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchTab('home')">Newsat<span>.space</span></div>
        <nav>
            <button onclick="switchTab('home')" class="active" id="nav-home">ප්‍රධාන පිටුව</button>
            <button onclick="switchTab('user')" id="nav-user">ගිණුම / නිව්ස් දැමීම</button>
            <button onclick="switchTab('admin')" id="nav-admin">ඇඩ්මින් පැනලය</button>
        </nav>
    </header>

    <div class="container">

        <!-- 1. HOME -->
        <div id="home" class="section active">
            <h2>🔥 නවතම පුවත්</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">අපගේ පරිශීලකයින් විසින් එකතු කරන ලද නවතම පුවත්.</p>
            <div class="news-grid" id="public-news-container"></div>
        </div>

        <!-- 2. USER DASHBOARD -->
        <div id="user" class="section">
            <div class="card" id="auth-card">
                <h3>👤 පරිශීලක ගිණුමට ඇතුළුවීම</h3>
                <input type="text" id="username" placeholder="ඔබේ නම (Username)">
                <input type="email" id="useremail" placeholder="ඊමේල් ලිපිනය (Email)">
                <button class="btn" onclick="registerUser()">ගිණුමට ඇතුළු වන්න</button>
            </div>

            <div class="card" id="add-news-card" style="display: none;">
                <div class="user-info">
                    <span>👤 පිවිසී ඇත්තේ: <strong id="logged-user-name" style="color: var(--primary);"></strong></span>
                    <button onclick="logoutUser()" style="background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Logout</button>
                </div>
                <h3>✍️ නව පුවතක් එකතු කරන්න</h3>
                <input type="text" id="news-title" placeholder="පුවතේ මාතෘකාව (Title)">
                <input type="file" id="news-image" accept="image/*">
                <textarea id="news-desc" rows="4" placeholder="පුවතේ සම්පූර්ණ විස්තරය..."></textarea>
                <button class="btn" id="submit-btn" onclick="submitNews()">පුවත Publish කිරීමට යොමු කරන්න</button>
            </div>
        </div>

        <!-- 3. ADMIN PANEL -->
        <div id="admin" class="section">
            <div class="card" id="admin-login-card" style="max-width: 450px; margin: 20px auto;">
                <h3>🔐 ඇඩ්මින් පිවිසුම (Admin Login)</h3>
                <input type="password" id="admin-password" placeholder="මුරපදය ඇතුළත් කරන්න">
                <button class="btn" onclick="verifyAdmin()">ඇතුළු වන්න</button>
            </div>

            <div class="card" id="admin-dashboard-card" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin-bottom: 0;">⚙️ ඇඩ්මින් පාලක මණ්ඩලය</h3>
                    <button onclick="logoutAdmin()" style="background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Admin Logout</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>මාතෘකාව</th>
                            <th>කර්තෘ</th>
                            <th>තත්ත්වය</th>
                            <th>ක්‍රියාමාර්ග</th>
                        </tr>
                    </thead>
                    <tbody id="admin-news-table"></tbody>
                </table>
            </div>
        </div>

    </div>

    <footer>&copy; 2026 Newsat.space. All Rights Reserved.</footer>

    <script>
        // --- FIREBASE CONFIGURATION (ඔබේ Firebase දත්ත මෙහි දමන්න) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const ADMIN_PASS = "cha1996AM";
        let isAdminLogged = sessionStorage.getItem('newsat_admin') === 'true';
        let currentUser = localStorage.getItem('newsat_user') || null;

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            
            if(tabId === 'home') fetchPublicNews();
            if(tabId === 'user') checkLoginState();
            if(tabId === 'admin') checkAdminState();
        }

        // Admin Auth
        function verifyAdmin() {
            if(document.getElementById('admin-password').value === ADMIN_PASS) {
                isAdminLogged = true;
                sessionStorage.setItem('newsat_admin', 'true');
                checkAdminState();
            } else { alert('මුරපදය වැරදියි!'); }
        }
        function checkAdminState() {
            if(isAdminLogged) {
                document.getElementById('admin-login-card').style.display = 'none';
                document.getElementById('admin-dashboard-card').style.display = 'block';
                fetchAllNews();
            } else {
                document.getElementById('admin-login-card').style.display = 'block';
                document.getElementById('admin-dashboard-card').style.display = 'none';
            }
        }
        function logoutAdmin() {
            isAdminLogged = false;
            sessionStorage.removeItem('newsat_admin');
            checkAdminState();
        }

        // User Auth
        function registerUser() {
            let name = document.getElementById('username').value.trim();
            if(!name) { alert('නම ඇතුළත් කරන්න!'); return; }
            currentUser = name;
            localStorage.setItem('newsat_user', currentUser);
            checkLoginState();
        }
        function checkLoginState() {
            if(currentUser) {
                document.getElementById('auth-card').style.display = 'none';
                document.getElementById('add-news-card').style.display = 'block';
                document.getElementById('logged-user-name').innerText = currentUser;
            } else {
                document.getElementById('auth-card').style.display = 'block';
                document.getElementById('add-news-card').style.display = 'none';
            }
        }
        function logoutUser() {
            localStorage.removeItem('newsat_user');
            currentUser = null;
            checkLoginState();
        }

        // Submit News with Firebase Storage & Firestore
        function submitNews() {
            let title = document.getElementById('news-title').value.trim();
            let desc = document.getElementById('news-desc').value.trim();
            let fileInput = document.getElementById('news-image');
            
            if(!title || !desc) { alert('සියල්ල පුරවන්න!'); return; }
            if(!fileInput.files[0]) { alert('කරුණාකර පින්තූරයක් තෝරන්න!'); return; }

            document.getElementById('submit-btn').innerText = "Upload වෙමින් පවතී...";
            document.getElementById('submit-btn').disabled = true;

            let file = fileInput.files[0];
            let storageRef = storage.ref('news_images/' + Date.now() + '_' + file.name);

            storageRef.put(file).then(snapshot => {
                return snapshot.ref.getDownloadURL();
            }).then(downloadURL => {
                return db.collection('news').add({
                    title: title,
                    desc: desc,
                    image: downloadURL,
                    author: currentUser,
                    status: "Pending",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }).then(() => {
                alert('පුවත සාර්ථකව යවන ලදී!');
                document.getElementById('news-title').value = '';
                document.getElementById('news-desc').value = '';
                document.getElementById('news-image').value = '';
                document.getElementById('submit-btn').innerText = "පුවත Publish කිරීමට යොමු කරන්න";
                document.getElementById('submit-btn').disabled = false;
                switchTab('home');
            }).catch(error => {
                alert('දෝෂයක් ඇති විය: ' + error.message);
                document.getElementById('submit-btn').innerText = "පුවත Publish කිරීමට යොමු කරන්න";
                document.getElementById('submit-btn').disabled = false;
            });
        }

        // Fetch Public News (Approved only)
        function fetchPublicNews() {
            let container = document.getElementById('public-news-container');
            container.innerHTML = '<p style="color:var(--text-muted);">පුවත් පූරණය වෙමින් පවතී...</p>';
            
            db.collection('news').where('status', '==', 'Approved').get().then(querySnapshot => {
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<p style="color:var(--text-muted);">තවම අනුමත කළ පුවත් නැත.</p>';
                    return;
                }
                querySnapshot.forEach(doc => {
                    let item = doc.data();
                    container.innerHTML += `
                        <div class="news-card">
                            <img src="${item.image}" alt="News">
                            <div class="news-content">
                                <div>
                                    <h3 class="news-title">${item.title}</h3>
                                    <p class="news-desc">${item.desc}</p>
                                </div>
                                <div class="news-meta">
                                    <span>කර්තෘ: ${item.author}</span>
                                    <span>✅ Active</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // Fetch All News for Admin
        function fetchAllNews() {
            let tbody = document.getElementById('admin-news-table');
            tbody.innerHTML = '<tr><td colspan="4">පූරණය වෙමින් පවතී...</td></tr>';
            
            db.collection('news').get().then(querySnapshot => {
                tbody.innerHTML = '';
                if(querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">පුවත් නැත.</td></tr>';
                    return;
                }
                querySnapshot.forEach(doc => {
                    let item = doc.data();
                    let id = doc.id;
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.title}</td>
                            <td>${item.author}</td>
                            <td><span style="color:${item.status === 'Approved' ? 'var(--success)' : 'orange'}">${item.status}</span></td>
                            <td>
                                ${item.status === 'Pending' ? `<button class="action-btn btn-approve" onclick="updateStatus('${id}', 'Approved')">Approve</button>` : ''}
                                <button class="action-btn btn-delete" onclick="deleteNews('${id}')">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function updateStatus(id, status) {
            db.collection('news').doc(id).update({ status: status }).then(() => {
                fetchAllNews();
            });
        }

        function deleteNews(id) {
            if(confirm('මෙම පුවත මකා දැමීමට අවශ්‍ය බව ස්ථිරද?')) {
                db.collection('news').doc(id).delete().then(() => {
                    fetchAllNews();
                });
            }
        }

        window.onload = function() {
            fetchPublicNews();
            checkLoginState();
        }
    </script>
</body>
</html>
