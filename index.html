<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 16px;
      background: #f4f6f8;
      color: #222;
    }
    h1 { text-align: center; }
    .card {
      background: #fff;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      background: #0d6efd;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0b5ed7; }
    .news-item {
      border-bottom: 1px solid #eee;
      padding: 14px 0;
    }
    .news-item:last-child { border-bottom: none; }
    .meta { font-size: 13px; color: #666; margin-bottom: 6px; }
    .status { font-size: 14px; color: green; min-height: 20px; }
  </style>
</head>
<body>

  <h1>පුවත් සංග්‍රහය (News)</h1>

  <!-- WRITE NEWS FORM -->
  <div class="card">
    <h2>අලුත් News එකක් Add කරන්න</h2>
    <form id="newsForm">
      <input type="text" id="title" placeholder="News ශීර්ෂය (Title)" required />
      <select id="category">
        <option value="General">General</option>
        <option value="Tech">Tech</option>
        <option value="Sports">Sports</option>
        <option value="Local">Local</option>
      </select>
      <input type="text" id="author" placeholder="කතෘ / මූලාශ්‍රය (Optional)" />
      <textarea id="content" placeholder="News විස්තරය මෙතන ලියන්න..." required></textarea>
      <button type="submit">Publish News</button>
      <div id="statusMsg" class="status"></div>
    </form>
  </div>

  <!-- READ NEWS LIST -->
  <div class="card">
    <h2>පළ වූ News</h2>
    <div id="newsList">Loading news...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    // Firebase Console -> Project Settings -> General -> Your apps වලින් ගන්නා Config එක මෙතන දාන්න
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const newsCol = collection(db, "news");

    const newsForm = document.getElementById("newsForm");
    const statusMsg = document.getElementById("statusMsg");
    const newsList = document.getElementById("newsList");

    // WRITE: අලුත් news එකක් Firestore වෙත save කිරීම
    newsForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusMsg.style.color = "#444";
      statusMsg.textContent = "Saving...";

      const title = document.getElementById("title").value.trim();
      const category = document.getElementById("category").value;
      const author = document.getElementById("author").value.trim() || "Anonymous";
      const content = document.getElementById("content").value.trim();

      try {
        await addDoc(newsCol, {
          title,
          category,
          author,
          content,
          createdAt: serverTimestamp()
        });
        newsForm.reset();
        statusMsg.style.color = "green";
        statusMsg.textContent = "News එක සාර්ථකව publish වුණා!";
      } catch (err) {
        console.error(err);
        statusMsg.style.color = "red";
        statusMsg.textContent = "Error: " + err.message;
      }
    });

    // READ: Real-time news list එක පෙන්වීම (අලුත්ම news උඩින්)
    const q = query(newsCol, orderBy("createdAt", "desc"));

    onSnapshot(q, (snapshot) => {
      if (snapshot.empty) {
        newsList.innerHTML = "<p>තවම news කිසිවක් add කර නැහැ.</p>";
        return;
      }

      newsList.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const dateStr = data.createdAt?.toDate
          ? data.createdAt.toDate().toLocaleString("si-LK")
          : "Just now";

        const div = document.createElement("div");
        div.className = "news-item";

        const h3 = document.createElement("h3");
        h3.textContent = data.title || "Untitled";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Category: ${data.category || "General"} | By: ${data.author || "Anonymous"} | ${dateStr}`;

        const p = document.createElement("p");
        p.textContent = data.content || "";

        div.append(h3, meta, p);
        newsList.appendChild(div);
      });
    }, (err) => {
      console.error(err);
      newsList.innerHTML = `<p style="color:red;">News load කරන්න බැරි වුණා: ${err.message}</p>`;
    });
  </script>
</body>
</html>
